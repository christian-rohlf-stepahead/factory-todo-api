{{- if .Values.webTerminal.image }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-terminal
  labels:
    app: {{ .Release.Name }}-web-terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web-terminal
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web-terminal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-terminal
          image: {{ .Values.webTerminal.image | quote }}
          ports:
            - containerPort: {{ .Values.webTerminal.port | default 3000 }}
          env:
            - name: PORT
              value: {{ .Values.webTerminal.port | default 3000 | quote }}
            - name: TODO_API_URL
              value: "http://{{ .Release.Name }}-api:3000"
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.webTerminal.port | default 3000 }}
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
